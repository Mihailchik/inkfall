input[type=range]::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:var(--ink);border:0}
.inks{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:8px 0 4px}

// ---------- shaders ----------
const VS=`#version 300 es
precision highp float;in vec2 a;out vec2 vUv,vL,vR,vT,vB;uniform vec2 texelSize;
void main(){vUv=a*.5+.5;vL=vUv-vec2(texelSize.x,0.);vR=vUv+vec2(texelSize.x,0.);vT=vUv+vec2(0.,texelSize.y);vB=vUv-vec2(0.,texelSize.y);gl_Position=vec4(a,0.,1.);}`;
const H=`#version 300 es
precision highp float;precision highp sampler2D;in vec2 vUv,vL,vR,vT,vB;out vec4 o;`;
const F={
splat:H+`uniform sampler2D uTarget;uniform float aspect,radius;uniform vec3 color;uniform vec2 point;
void main(){vec2 p=vUv-point;p.x*=aspect;o=vec4(texture(uTarget,vUv).xyz+exp(-dot(p,p)/radius)*color,1.);}`,
advect:H+`uniform sampler2D uVelocity,uSource;uniform vec2 texelSize,srcTexel;uniform float dt,dissipation,diffuse,fiber,ntime;
float h21(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}
float vn(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);
 return mix(mix(h21(i),h21(i+vec2(1,0)),f.x),mix(h21(i+vec2(0,1)),h21(i+vec2(1,1)),f.x),f.y);}
vec2 curlN(vec2 p){float e=.09;
 float a=vn(p+vec2(0,e)),b=vn(p-vec2(0,e)),c1=vn(p+vec2(e,0)),d1=vn(p-vec2(e,0));
 return vec2(a-b,d1-c1)/(2.*e);}
void main(){vec2 c=vUv-dt*texture(uVelocity,vUv).xy*texelSize;
 if(fiber>0.){vec2 f1=curlN(vUv*10.+vec2(ntime*.028,-ntime*.019));
  vec2 f2=curlN(vUv*26.+vec2(-ntime*.047,ntime*.036));
  c+=(f1*.62+f2*.38)*fiber*srcTexel*3.2;}
 vec4 v=texture(uSource,c);
 if(diffuse>0.){vec4 nb=(texture(uSource,c+vec2(srcTexel.x,0.))+texture(uSource,c-vec2(srcTexel.x,0.))+texture(uSource,c+vec2(0.,srcTexel.y))+texture(uSource,c-vec2(0.,srcTexel.y)))*.25;
  v=mix(v,nb,diffuse);}
 o=dissipation*v;o.a=1.;}`,
div:H+`uniform sampler2D uVelocity;
void main(){float L=texture(uVelocity,vL).x,R=texture(uVelocity,vR).x,T=texture(uVelocity,vT).y,B=texture(uVelocity,vB).y;vec2 C=texture(uVelocity,vUv).xy;
 if(vL.x<0.)L=-C.x;if(vR.x>1.)R=-C.x;if(vT.y>1.)T=-C.y;if(vB.y<0.)B=-C.y;o=vec4(.5*(R-L+T-B),0.,0.,1.);}`,
curl:H+`uniform sampler2D uVelocity;
void main(){float L=texture(uVelocity,vL).y,R=texture(uVelocity,vR).y,T=texture(uVelocity,vT).x,B=texture(uVelocity,vB).x;o=vec4(.5*(R-L-T+B),0.,0.,1.);}`,
vort:H+`uniform sampler2D uVelocity,uCurl,uDye;uniform float curl,dt,grav;
void main(){float L=texture(uCurl,vL).x,R=texture(uCurl,vR).x,T=texture(uCurl,vT).x,B=texture(uCurl,vB).x,C=texture(uCurl,vUv).x;
 vec2 f=.5*vec2(abs(T)-abs(B),abs(R)-abs(L));f/=length(f)+1e-4;f*=curl*C;f.y*=-1.;vec2 v=texture(uVelocity,vUv).xy+f*dt;
 float d=length(texture(uDye,vUv).rgb);

 v*=1.-min(.5,dt*d*.35);
 o=vec4(clamp(v,-1000.,1000.),0.,1.);}`,
press:H+`uniform sampler2D uPressure,uDivergence;
void main(){float L=texture(uPressure,vL).x,R=texture(uPressure,vR).x,T=texture(uPressure,vT).x,B=texture(uPressure,vB).x;o=vec4((L+R+B+T-texture(uDivergence,vUv).x)*.25,0.,0.,1.);}`,
grad:H+`uniform sampler2D uPressure,uVelocity;
void main(){float L=texture(uPressure,vL).x,R=texture(uPressure,vR).x,T=texture(uPressure,vT).x,B=texture(uPressure,vB).x;vec2 v=texture(uVelocity,vUv).xy-vec2(R-L,T-B);o=vec4(v,0.,1.);}`,
clear:H+`uniform sampler2D uTexture;uniform float value;void main(){o=value*texture(uTexture,vUv);}`,
show:H+`uniform sampler2D uTexture;uniform vec2 texelSize;uniform float time,sharp;
float hash(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}
void main(){
 vec3 c=texture(uTexture,vUv).rgb;
 float raw=length(c);
 vec3 tint=c/max(raw,1e-4);
 float d=pow(raw,sharp);
 // свет проходит сквозь слой пигмента и возвращается: то, что не поглощено
 vec3 absorb=(1.-tint)*2.0+.14;
 vec3 T=exp(-d*2.4*absorb);
 float S=1.-exp(-d*2.6);
 float l=length(texture(uTexture,vL).rgb),r=length(texture(uTexture,vR).rgb),
       tt=length(texture(uTexture,vT).rgb),b=length(texture(uTexture,vB).rgb);
 vec3 n=normalize(vec3(r-l,tt-b,length(texelSize)*2.4));
 float lam=clamp(dot(n,normalize(vec3(-.28,.6,.75))),0.,1.);
 vec3 water=vec3(.05,.043,.058),lamp=vec3(1.,.955,.885);
 vec3 col=water*(1.-S)+lamp*T*S*2.35*(.72+.5*lam);
 // тонкая кромка светится насквозь

 // мокрый блик только там, где плёнка достаточно плотная

 vec2 q=vUv-.5;col*=1.-.5*dot(q,q);

const STEPS=[768,1024,1536,2048,3072];

 const i=STEPS.indexOf(liveDetail);if(i<0)return;

 if(oD){const u=use('clear',0,0);gl.uniform1f(u.value,1);gl.uniform1i(u.uTexture,oD.read.bind(0));blit(dye.write);dye.swap();gl.uniform1i(u.uTexture,oV.read.bind(0));blit(vel.write);vel.swap()}}

const queue=[];
function splat(x,y,dx,dy,color,rad){const asp=canvas.width/canvas.height;let u=use('splat',vel.tx,vel.ty);
 gl.uniform1i(u.uTarget,vel.read.bind(0));gl.uniform1f(u.aspect,asp);gl.uniform2f(u.point,x,1-y);gl.uniform3f(u.color,dx,dy,0);gl.uniform1f(u.radius,rad*(asp>1?asp:1));blit(vel.write);vel.swap();

function stroke(x,y,dx,dy,down,t,mul=1){const sp=Math.hypot(dx,dy);if(sp<1)return;

// ---------- autopilot brush ----------
const ap={x:.5,y:.5,seed:Math.random()*100,init:false};
function autopilot(t,dt){const s=ap.seed;const x=.5+.34*Math.sin(t*.17+s)+.11*Math.sin(t*.43+s*2.1),y=.5+.3*Math.cos(t*.21+s*3)+.1*Math.sin(t*.57+s);

// ---------- sound ----------
let ac=null,on=false,master,bus,swishGain,swishFilter,swishPan,swishLevel=0,swishPos=[.5,.5],lastBubble=0;
function noiseBuf(sec,brown){const n=Math.floor(ac.sampleRate*sec),b=ac.createBuffer(1,n,ac.sampleRate),d=b.getChannelData(0);let l=0;
 for(let i=0;i<n;i++){const w=Math.random()*2-1;if(brown){l=(l+.02*w)/1.02;d[i]=l*3.5}else d[i]=w}return b}
function impulse(sec,decay){const n=Math.floor(ac.sampleRate*sec),b=ac.createBuffer(2,n,ac.sampleRate);
 for(let ch=0;ch<2;ch++){const d=b.getChannelData(ch);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,decay)}return b}
function initAudio(){ac=new (window.AudioContext||window.webkitAudioContext)();master=ac.createGain();master.gain.value=0;master.connect(ac.destination);
 bus=ac.createGain();const dry=ac.createGain();dry.gain.value=.8;const conv=ac.createConvolver();conv.buffer=impulse(2.8,2.4);const cl=ac.createBiquadFilter();cl.type='lowpass';cl.frequency.value=2600;const wet=ac.createGain();wet.gain.value=.45;
 bus.connect(dry);dry.connect(master);bus.connect(cl);cl.connect(conv);conv.connect(wet);wet.connect(master);
 // underwater bed
 const bed=ac.createBufferSource();bed.buffer=noiseBuf(4,true);bed.loop=true;const lp=ac.createBiquadFilter();lp.type='lowpass';lp.frequency.value=300;lp.Q.value=.7;
 const lfo=ac.createOscillator();lfo.frequency.value=.05;const lg=ac.createGain();lg.gain.value=130;lfo.connect(lg);lg.connect(lp.frequency);
 const bg=ac.createGain();bg.gain.value=.42;bed.connect(lp);lp.connect(bg);bg.connect(master);bed.start();lfo.start();
 // slow lapping of water at the edges
 const lap=ac.createBufferSource();lap.buffer=noiseBuf(3,false);lap.loop=true;const lbp=ac.createBiquadFilter();lbp.type='bandpass';lbp.frequency.value=420;lbp.Q.value=1.4;
 const lgn=ac.createGain();lgn.gain.value=0;const l2=ac.createOscillator();l2.frequency.value=.11;const g2=ac.createGain();g2.gain.value=.02;l2.connect(g2);g2.connect(lgn.gain);
 lap.connect(lbp);lbp.connect(lgn);lgn.connect(bus);lap.start();l2.start();
 // brush swish
 const sw=ac.createBufferSource();sw.buffer=noiseBuf(2,false);sw.loop=true;swishFilter=ac.createBiquadFilter();swishFilter.type='bandpass';swishFilter.frequency.value=700;swishFilter.Q.value=1.1;
 swishGain=ac.createGain();swishGain.gain.value=0;swishPan=ac.createStereoPanner();sw.connect(swishFilter);swishFilter.connect(swishGain);swishGain.connect(swishPan);swishPan.connect(bus);sw.start();}
// position → distance attenuation, dullness and stereo placement
function spatial(x,y){const asp=innerWidth/innerHeight,d=Math.hypot((x-.5)*Math.min(asp,1.8),(y-.5)*1.2);
 const g=ac.createGain();g.gain.value=1/(1+d*2.6);const lp=ac.createBiquadFilter();lp.type='lowpass';lp.frequency.value=6500/(1+d*3.5);
 const pan=ac.createStereoPanner();pan.pan.value=Math.max(-1,Math.min(1,(x-.5)*1.8));g.connect(lp);lp.connect(pan);pan.connect(bus);return g}
function dripSound(x,y,size,vol=1){if(!on)return;const t=ac.currentTime,out=spatial(x,y);
 // the bubble: pitch rises as the cavity closes
 const f0=(1400-size*1000)*(.9+Math.random()*.25);
 const o=ac.createOscillator();o.type='sine';o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f0*1.9,t+.11+size*.12);
 const g=ac.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.55*vol,t+.004);g.gain.exponentialRampToValueAtTime(.0004,t+.16+size*.4);

 // low thump for bigger drops
 if(size>.25){const o2=ac.createOscillator();o2.frequency.setValueAtTime(120+50*(1-size),t);o2.frequency.exponentialRampToValueAtTime(48,t+.16);
  const g2=ac.createGain();g2.gain.setValueAtTime(.45*size*vol,t);g2.gain.exponentialRampToValueAtTime(.0004,t+.24);o2.connect(g2);g2.connect(out);o2.start(t);o2.stop(t+.3)}

 const n=ac.createBufferSource();n.buffer=noiseBuf(.35,false);const bp=ac.createBiquadFilter();bp.type='bandpass';bp.frequency.value=2400+2200*(1-size);bp.Q.value=.8;
 const ng=ac.createGain();ng.gain.setValueAtTime((.06+.18*size)*vol,t);ng.gain.exponentialRampToValueAtTime(.0004,t+.1+size*.14);n.connect(bp);bp.connect(ng);ng.connect(out);n.start(t)}
function swish(speed,x,y){if(!on)return;swishLevel=Math.min(1,swishLevel+speed/9000);swishPos=[x,y];

 // fast strokes trap air: small bubbles
 const now=performance.now();if(speed>1800&&now-lastBubble>90&&Math.random()<.35){lastBubble=now;dripSound(x+(Math.random()-.5)*.05,y+(Math.random()-.5)*.05,.05+Math.random()*.15,.35)}}
function soundTick(dt){if(!on)return;swishLevel*=Math.exp(-dt*6);swishGain.gain.setTargetAtTime(swishLevel*.14,ac.currentTime,.03)}
function ensureAudio(){if(!ac)initAudio();if(ac.state==='suspended')ac.resume()}
function setSound(v){ensureAudio();on=v;master.gain.setTargetAtTime(on?S.vol:0,ac.currentTime,.6);$('snd').textContent=T(on?'snd_on':'snd_off');$('snd').classList.toggle('on',on)}

let sndSeen=true;try{sndSeen=!!localStorage.getItem(SEEN)}catch(e){}
if(!sndSeen)setTimeout(()=>{if(on)return;
 $('invite').hidden=false;requestAnimationFrame(()=>$('invite').classList.add('on'));
 $('hint').classList.add('gone');setTimeout(()=>{if(!on)hideInvite()},22000)},9000);

// ---------- listening: microphone or system audio ----------
let listen=null,micBase={low:0,high:0,all:0},lastLow=0,lastHigh=0;
let noteKey='n_default';
function note(k){noteKey=k;$('micNote').textContent=T(k)}
function stopListen(){if(listen){try{listen.stream.getTracks().forEach(t=>t.stop())}catch(e){}listen=null}
 $('mic').textContent=T('mic');$('mic').classList.remove('on');$('sys').textContent=T('sys');$('sys').classList.remove('on')}
function startAnalyser(stream,labelKey,btn){ensureAudio();
 const src=ac.createMediaStreamSource(stream),an=ac.createAnalyser();an.fftSize=1024;an.smoothingTimeConstant=.5;src.connect(an);
 listen={stream,an,data:new Uint8Array(an.frequencyBinCount)};micBase={low:0,high:0,all:0};
 btn.textContent=T(labelKey);btn.classList.add('on');
 const tr=stream.getTracks()[0];if(tr)tr.addEventListener('ended',stopListen);
 note('n_listening')}
function why(e){const n=e&&e.name;
 if(n==='NotAllowedError')return location.protocol==='file:'?'n_file':'n_denied';
 if(n==='NotFoundError')return 'n_nodevice';
 if(n==='NotReadableError')return 'n_busy';
 if(n==='SecurityError')return 'n_insecure';
 return 'n_failed'}
$('mic').onclick=async()=>{if(listen){stopListen();note('n_off');return}
 if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){note('n_denied');return}
 note('n_asking');
 try{const stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:false,autoGainControl:false}});
  startAnalyser(stream,'mic_on',$('mic'))}
 catch(e){note(why(e))}};
$('sys').onclick=async()=>{if(listen){stopListen();note('n_off');return}
 if(!navigator.mediaDevices||!navigator.mediaDevices.getDisplayMedia){note('n_denied');return}
 note('n_tickbox');
 try{const stream=await navigator.mediaDevices.getDisplayMedia({video:true,audio:true});
  if(!stream.getAudioTracks().length){stream.getTracks().forEach(t=>t.stop());note('n_noaudio');return}
  stream.getVideoTracks().forEach(t=>{t.stop();stream.removeTrack(t)});
  startAnalyser(stream,'sys_on',$('sys'))}
 catch(e){note(why(e))}};
function micTick(now){if(!listen)return;const d=listen.data;listen.an.getByteFrequencyData(d);const avg=(a,b)=>{let s=0;for(let i=a;i<b;i++)s+=d[i];return s/(b-a)};
 const low=avg(2,14),high=avg(60,260),all=avg(2,260);
 micBase.low+=(low-micBase.low)*.006;micBase.high+=(high-micBase.high)*.006;micBase.all+=(all-micBase.all)*.006;
 const k=S.sens;
 if(low>micBase.low+26/k&&low>40/k&&now-lastLow>260){lastLow=now;const sz=.004+Math.min(.012,(low-micBase.low)/255*.03);drop(.15+Math.random()*.7,.15+Math.random()*.7,sz,tsec,true)}
 if(high>micBase.high+16/k&&high>22/k&&now-lastHigh>110){lastHigh=now;const n=1+Math.floor(Math.random()*3);for(let i=0;i<n;i++)drop(.1+Math.random()*.8,.1+Math.random()*.8,.0006+Math.random()*.0015,tsec,true)}
 const e=Math.max(0,(all-micBase.all-6/k))/255;if(e>0&&Math.random()<e*4){const x=Math.random(),y=Math.random();queue.push({x,y,dx:(Math.random()-.5)*900*e,dy:(Math.random()-.5)*900*e,c:[0,0,0],rad:.004})}}

// ---------- scene controls ----------
let clearUntil=0;
$('clr').onclick=()=>{clearUntil=performance.now()+1100};
if(!document.documentElement.requestFullscreen)$('fs').style.display='none';
$('fs').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen().catch(()=>{})};
$('inkdot').onclick=()=>setInk(S.ink>=INKS.length-2?-1:S.ink+1);
$('gear').onclick=()=>{panel.hidden=!panel.hidden;$('gear').classList.toggle('open',!panel.hidden)};
addEventListener('keydown',e=>{if(e.target.tagName==='SELECT'||e.target.tagName==='INPUT')return;const k=e.key.toLowerCase();
 if(k==='f')$('fs').click();if(k==='s')$('snd').click();if(k==='r')$('pGo').click();if(k==='c')$('clr').click();if(k==='m')$('mic').click();
 if(e.key==='Escape'){panel.hidden=true;$('gear').classList.remove('open')}});
// bind sliders and selects to settings
const NUMS=['speed','amount','rad','fiber','sharp','grav','curl','diff','vol','sens'];
function syncUI(){NUMS.forEach(k=>$(k).value=S[k]);$('detail').value=S.detail;$('auto').value=S.auto;$('drops').value=S.drops;$('preset').value=S.preset}
function markCustom(){S.preset='custom';$('preset').value='custom'}
NUMS.forEach(k=>{$(k).oninput=()=>{S[k]=+$(k).value;if(k!=='vol'&&k!=='sens')markCustom();save();if(k==='vol'&&on)master.gain.setTargetAtTime(S.vol,ac.currentTime,.1)}});
$('detail').onchange=()=>{const v=$('detail').value;S.detail=v==='auto'?'auto':+v;markCustom();if(v!=='auto')liveDetail=+v;dyeCap=targetDetail();init();save()};
$('auto').onchange=()=>{S.auto=$('auto').value;save()};
$('drops').onchange=()=>{S.drops=$('drops').value;save()};
$('preset').onchange=()=>{const k=$('preset').value,pr=PRESETS[k];if(!pr){S.preset='custom';save();return}
 const keepAuto=S.detail==='auto';Object.keys(pr).forEach(n=>S[n]=pr[n]);
 if(keepAuto)S.detail='auto';else liveDetail=+S.detail;
 S.preset=k;dyeCap=targetDetail();init();syncUI();save();toast(T('o_'+k))};
liveDetail=weak?1024:1536;dyeCap=targetDetail();init();syncUI();
paint();

// ---------- recording ----------
const FORMATS=[['mp4','MP4 · H.264',['video/mp4;codecs=avc1.640028,mp4a.40.2','video/mp4;codecs=avc1.640028,opus','video/mp4;codecs=avc1,opus','video/mp4;codecs=avc1','video/mp4']],
 ['webm','WebM · VP9',['video/webm;codecs=vp9,opus','video/webm;codecs=vp9','video/webm;codecs=vp8,opus','video/webm']]];
const canRec=('MediaRecorder' in window)&&!!canvas.captureStream;
const avail=canRec?FORMATS.map(([ext,label,mimes])=>[ext,label,mimes.find(m=>MediaRecorder.isTypeSupported(m))]).filter(f=>f[2]):[];
avail.forEach(([ext,label,mime])=>{const o=document.createElement('option');o.value=ext;o.textContent=label;o.dataset.mime=mime;$('pFmt').appendChild(o)});
const pNoteKey=!canRec?'r_norec':avail[0][0]==='mp4'?'r_mp4':'r_webm';
let recCanvas=null,recCtx=null,recW=0,recH=0,snapWant=null,snapPhase=0;
function pickSize(){return $('pRes').value==='win'?[canvas.width,canvas.height]:$('pRes').value.split('x').map(Number)}
$('pSnap').onclick=()=>{if(recorder||snapWant)return;const[w,h]=pickSize();
 snapWant={w,h};snapPhase=0;$('pSnap').textContent=T('b_preparing');
 if($('pRes').value!=='win'){recorder=true;const k=Math.max(w/innerWidth,h/innerHeight);
  dyeCap=Math.max(w,h)>=1440?2048:1536;setSize(Math.round(innerWidth*k),Math.round(innerHeight*k))}};
function takeSnap(){const{w,h}=snapWant;snapWant=null;
 const out=document.createElement('canvas');out.width=w;out.height=h;const cx=out.getContext('2d');
 const sa=canvas.width/canvas.height,ta=w/h;let sw,sh;if(sa>ta){sh=canvas.height;sw=sh*ta}else{sw=canvas.width;sh=sw/ta}
 cx.drawImage(canvas,(canvas.width-sw)/2,(canvas.height-sh)/2,sw,sh,0,0,w,h);
 recorder=null;dyeCap=targetDetail();resize();
 out.toBlob(b=>{const name=`inkfall-${w}x${h}.png`,u=URL.createObjectURL(b);
  const a=document.createElement('a');a.href=u;a.download=name;a.click();
  setTimeout(()=>URL.revokeObjectURL(u),4000);
  $('pSnap').textContent=T('b_snapshot')},'image/png')}
$('pGo').onclick=()=>{if(recorder&&recorder!==true){recorder.stop();return}if(!canRec||!avail.length)return;
 const dur=+$('pDur').value*1000,opt=$('pFmt').selectedOptions[0],mime=opt.dataset.mime,ext=opt.value;
 let w,h;if($('pRes').value==='win'){w=canvas.width;h=canvas.height}else[w,h]=$('pRes').value.split('x').map(Number);
 recorder=true;const k=Math.max(w/innerWidth,h/innerHeight);dyeCap=Math.max(h,w)>=1440?2048:1536;
 if($('pRes').value!=='win')setSize(Math.round(innerWidth*k),Math.round(innerHeight*k));
 recCanvas=document.createElement('canvas');recCanvas.width=recW=w;recCanvas.height=recH=h;recCtx=recCanvas.getContext('2d');
 const stream=recCanvas.captureStream(60);
 if(on&&ac){const dst=ac.createMediaStreamDestination();master.connect(dst);dst.stream.getAudioTracks().forEach(t=>stream.addTrack(t))}
 const chunks=[];recorder=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:Math.round(w*h*6)});
 recorder.ondataavailable=e=>chunks.push(e.data);
 recorder.onstop=()=>{const blob=new Blob(chunks,{type:mime}),name=`inkfall-${w}x${h}.${ext}`;
  recorder=null;recCanvas=null;dyeCap=targetDetail();resize();clearTimeout($('pGo')._t);
  const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;a.click();
  setTimeout(()=>URL.revokeObjectURL(u),8000);
  $('pGo').textContent=T('b_record');$('pGo').classList.remove('busy')};
 recorder.start(250);const t0=performance.now();panel.hidden=true;$('gear').classList.remove('open');
 const tick=()=>{if(!recorder||recorder===true)return;const left=Math.max(0,Math.ceil((dur-(performance.now()-t0))/1000));$('pGo').textContent=T('b_recording').replace('%s',left);if(left>0)$('pGo')._t=setTimeout(tick,250);else recorder.stop()};tick()};

// ---------- simulation ----------
let last=performance.now();
function step(dt){let u;const clr=clearUntil>performance.now();
 u=use('curl',vel.tx,vel.ty);gl.uniform1i(u.uVelocity,vel.read.bind(0));blit(curl);
 u=use('vort',vel.tx,vel.ty);gl.uniform1i(u.uVelocity,vel.read.bind(0));gl.uniform1i(u.uCurl,curl.bind(1));gl.uniform1i(u.uDye,dye.read.bind(2));gl.uniform1f(u.curl,S.curl);gl.uniform1f(u.grav,S.grav);gl.uniform1f(u.dt,dt);blit(vel.write);vel.swap();
 u=use('div',vel.tx,vel.ty);gl.uniform1i(u.uVelocity,vel.read.bind(0));blit(div);
 u=use('clear',vel.tx,vel.ty);gl.uniform1i(u.uTexture,pres.read.bind(0));gl.uniform1f(u.value,.8);blit(pres.write);pres.swap();
 u=use('press',vel.tx,vel.ty);gl.uniform1i(u.uDivergence,div.bind(0));for(let i=0;i<22;i++){gl.uniform1i(u.uPressure,pres.read.bind(1));blit(pres.write);pres.swap()}
 u=use('grad',vel.tx,vel.ty);gl.uniform1i(u.uPressure,pres.read.bind(0));gl.uniform1i(u.uVelocity,vel.read.bind(1));blit(vel.write);vel.swap();
 u=use('advect',vel.tx,vel.ty);gl.uniform1i(u.uVelocity,vel.read.bind(0));gl.uniform1i(u.uSource,vel.read.bind(0));gl.uniform2f(u.srcTexel,vel.tx,vel.ty);gl.uniform1f(u.diffuse,0);gl.uniform1f(u.fiber,0);gl.uniform1f(u.dt,dt);gl.uniform1f(u.dissipation,clr?1/(1+dt*7):1/(1+dt*.35));blit(vel.write);vel.swap();
 gl.uniform1i(u.uVelocity,vel.read.bind(0));gl.uniform1i(u.uSource,dye.read.bind(1));gl.uniform2f(u.srcTexel,dye.tx,dye.ty);gl.uniform1f(u.diffuse,Math.min(.5,dt*S.diff*9));gl.uniform1f(u.fiber,S.fiber);gl.uniform1f(u.ntime,tsec);gl.uniform1f(u.dissipation,clr?1/(1+dt*7):1/(1+dt*.08));blit(dye.write);dye.swap()}
document.addEventListener('visibilitychange',()=>{if(!ac)return;
 master.gain.setTargetAtTime(document.hidden?0:(on?S.vol:0),ac.currentTime,.25)});
function frame(now){const real=Math.min((now-last)/1000,1/30);last=now;tsec=now/1000;const dt=real*S.speed;
 const idle=now-lastMove>3200;if(idle)document.body.classList.add('idle');
 if(S.auto==='always'||(S.auto==='idle'&&idle))autopilot(tsec,real);else ap.init=false;
 if(S.drops==='on'&&!reduced&&idle&&now-lastDrop>nextDrop){lastDrop=now;nextDrop=2200+Math.random()*3500;drop(.15+Math.random()*.7,.15+Math.random()*.7,.003+Math.random()*.004,tsec)}
 micTick(now);
 while(queue.length){const s=queue.shift();splat(s.x,s.y,s.dx,s.dy,s.c,s.rad)}
 step(dt);soundTick(real);tune(now,real);
 {const cc=css(inkColor(tsec));if(S.ink<0)autoB.style.setProperty('--c',cc);$('inkdot').style.setProperty('--c',cc);}
 const u=use('show',dye.tx,dye.ty);gl.uniform1i(u.uTexture,dye.read.bind(0));gl.uniform1f(u.time,tsec);gl.uniform1f(u.sharp,S.sharp);blit(null);
 if(snapWant&&snapPhase++>2)takeSnap();
 if(recCanvas){const sa=canvas.width/canvas.height,ta=recW/recH;let sw,sh;if(sa>ta){sh=canvas.height;sw=sh*ta}else{sw=canvas.width;sh=sw/ta}
  recCtx.drawImage(canvas,(canvas.width-sw)/2,(canvas.height-sh)/2,sw,sh,0,0,recW,recH)}
 requestAnimationFrame(frame)}
queue.push({x:.55,y:.45,dx:120,dy:-80,c:INKS[0][1].map(v=>v*1.3),rad:.007});
queue.push({x:.4,y:.6,dx:-90,dy:60,c:INKS[2][1].map(v=>v*.9),rad:.005});
requestAnimationFrame(frame);

function applyLang(){
 document.documentElement.lang=LANG;
 document.querySelectorAll('[data-i18n]').forEach(e=>{e.textContent=T(e.dataset.i18n)});
 document.querySelectorAll('[data-i18n-title]').forEach(e=>{e.title=T(e.dataset.i18nTitle)});
 $('snd').textContent=T(on?'snd_on':'snd_off');
 if(!listen){$('mic').textContent=T('mic');$('sys').textContent=T('sys')}
 $('pSnap').textContent=T('b_snapshot');
 if(!recorder)$('pGo').textContent=T('b_record');
 $('pNote').textContent=T(pNoteKey);
 $('micNote').textContent=T(noteKey);
 $('lang').value=LANG;
 paint();
}
$('lang').onchange=()=>{LANG=$('lang').value;try{localStorage.setItem('inkfall-lang',LANG)}catch(e){}applyLang()};
applyLang();
</script>
