<script>
// тема решается до первой отрисовки, чтобы не мигало
(function(){var t=null;try{t=localStorage.getItem('inkfall-theme')}catch(e){}
 var p=new URLSearchParams(location.search).get('theme');if(p==='light'||p==='dark')t=p;
 if(t!=='light'&&t!=='dark')t=matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';
 document.documentElement.dataset.theme=t;
 if(t==='light')document.querySelector('meta[name=theme-color]').content='#e6e8e8'})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Jost:wght@300;400&display=swap">
<style>
:root{
 --bg:#0d0b10;--ink:#efe6da;--mute:rgba(239,230,218,.56);--faint:rgba(239,230,218,.08);
 --line:rgba(239,230,218,.16);--accent:#f2b95a;--on-accent:#16110a;
 --glass:rgba(16,13,20,.55);--glass-strong:rgba(16,13,20,.84);--card:#15121a;--dim:#bdb4a8;
 --halo:0 0 1px rgba(8,6,10,.95),0 0 2px rgba(8,6,10,.9),0 1px 4px rgba(8,6,10,.75),0 0 12px rgba(8,6,10,.6),0 0 28px rgba(8,6,10,.45);
 --halo-img:drop-shadow(0 0 1px rgba(8,6,10,.95)) drop-shadow(0 0 4px rgba(8,6,10,.7));
 --halo-sm:0 0 1px rgba(8,6,10,1),0 0 1px rgba(8,6,10,1),0 0 3px rgba(8,6,10,.9),0 0 6px rgba(8,6,10,.55);--rec:#ff5a4d;--shadow:0 10px 40px rgba(0,0,0,.35)
}
:root[data-theme="light"]{
 --bg:#e6e8e8;--ink:#1e1d23;--mute:rgba(30,29,35,.6);--faint:rgba(30,29,35,.06);
 --line:rgba(30,29,35,.14);--accent:#9c5218;--on-accent:#fbf7f1;
 --glass:rgba(246,247,247,.6);--glass-strong:rgba(248,249,249,.9);--card:#f6f7f7;--dim:#4e4c55;
 --halo:0 0 1px rgba(255,255,255,.98),0 0 2px rgba(255,255,255,.95),0 1px 4px rgba(255,255,255,.8),0 0 12px rgba(255,255,255,.7),0 0 28px rgba(255,255,255,.55);
 --halo-img:drop-shadow(0 0 1px rgba(255,255,255,.98)) drop-shadow(0 0 4px rgba(255,255,255,.75));
 --halo-sm:0 0 1px rgba(255,255,255,1),0 0 1px rgba(255,255,255,1),0 0 3px rgba(255,255,255,.95),0 0 6px rgba(255,255,255,.6);--rec:#d23a2e;--shadow:0 10px 40px rgba(40,44,48,.14)
}
*{box-sizing:border-box}
:root{color-scheme:dark}
:root[data-theme="light"]{color-scheme:light}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--bg);overflow:hidden}
body{color:var(--ink);font:300 14px/1.5 'Jost',system-ui,sans-serif;cursor:crosshair;-webkit-font-smoothing:antialiased}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button{font:inherit;color:inherit}
.ui{position:fixed;z-index:2;user-select:none;transition:opacity 1.8s ease}
/* один переключатель на всё: пока человек что-то делает — горит, потом всё вместе гаснет */
body:not(.awake) .brand,body:not(.awake) .dock{opacity:.1}
body:not(.awake) .hint{opacity:0;pointer-events:none}
body.awake .brand,body.awake .dock,body.awake .hint{opacity:1;transition:opacity .5s ease}
.brand{left:calc(28px + env(safe-area-inset-left));top:calc(22px + env(safe-area-inset-top));animation:brandIn 1.4s ease both}
.brand::before{content:"";position:absolute;left:-70px;top:-60px;right:-110px;bottom:-50px;z-index:-1;pointer-events:none;
 background:radial-gradient(closest-side,color-mix(in srgb,var(--bg) 82%,transparent),transparent);opacity:0;transition:opacity 1.2s}
body.awake .brand::before{opacity:1}
.name{font:600 34px/1 'Fraunces',Georgia,serif;letter-spacing:.005em;text-shadow:var(--halo)}
.name .ttl{display:block;transition:text-shadow 1.2s}
body.awake .name .ttl{text-shadow:var(--halo),0 0 30px color-mix(in srgb,var(--accent) 55%,transparent)}
.name .sub{display:block;font:400 11px/1.6 'Jost',sans-serif;letter-spacing:.26em;text-transform:uppercase;color:var(--dim);margin-top:10px;text-shadow:var(--halo-sm)}
.credit{display:inline-flex;align-items:center;gap:8px;margin-top:12px;font:400 12px/1 'Jost',sans-serif;letter-spacing:.1em;color:var(--dim);text-decoration:none;transition:color .3s;text-shadow:var(--halo-sm)}
.credit img{width:20px;height:20px;display:block;filter:var(--halo-img)}
:root[data-theme="light"] .credit img{filter:invert(1) brightness(.25) var(--halo-img)}
.credit:hover,.credit:focus-visible{color:var(--accent);outline:none}
@keyframes brandIn{from{opacity:0;filter:blur(6px);transform:translateY(6px)}}
.hint{left:calc(28px + env(safe-area-inset-left));bottom:calc(26px + env(safe-area-inset-bottom));color:var(--dim);letter-spacing:.04em;max-width:46ch;text-shadow:var(--halo-sm)}
.hint::before{content:"";position:absolute;inset:-26px -44px;z-index:-1;pointer-events:none;background:radial-gradient(closest-side,color-mix(in srgb,var(--bg) 72%,transparent),transparent)}
.toast{left:50%;bottom:104px;transform:translateX(-50%);color:var(--ink);background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:7px 14px;
 letter-spacing:.18em;text-transform:uppercase;font-size:11px;white-space:nowrap;opacity:0;transition:opacity .35s;pointer-events:none}
.toast.long{white-space:normal;text-transform:none;letter-spacing:.02em;font-size:13px;line-height:1.35;text-align:center;width:max-content;max-width:min(88vw,460px);border-radius:14px;padding:9px 16px}
.toast.on{opacity:1}

/* панель действий */
.dock{right:calc(18px + env(safe-area-inset-right));bottom:calc(18px + env(safe-area-inset-bottom));display:flex;align-items:stretch;gap:2px;padding:6px;border-radius:20px;
 background:var(--glass-strong);border:1px solid var(--line);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:var(--shadow)}
.dock button{width:60px;height:56px;border-radius:14px;border:0;background:transparent;color:var(--mute);cursor:pointer;
 display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:0;transition:color .2s,background .2s}
.dock button:hover,.dock button:focus-visible,.dock button.open{color:var(--ink);background:var(--faint);outline:none}
.dock button.on{color:var(--accent)}
.dock svg{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.dock .lbl{font-size:10.5px;line-height:1;letter-spacing:.02em;white-space:nowrap}
.dock .sep{width:1px;align-self:center;height:32px;background:var(--line);margin:0 4px}
.dot{width:20px;height:20px;flex:none;border-radius:50%;background:var(--c,#f2b95a);box-shadow:0 0 0 1.5px var(--line)}
#dCapture.rec{color:var(--rec)}
#dCapture.rec svg circle:last-child{animation:pulse 1.2s ease-in-out infinite}
.i-sun,.i-snd-on{display:none}
:root[data-theme="dark"] .i-moon{display:none}
:root[data-theme="dark"] .i-sun{display:block}
#dSound.on .i-snd-off{display:none}
#dSound.on .i-snd-on{display:block}

/* всплывающие листы: без размытия фона — под ними каждый кадр меняется анимация */
.sheet,.pop{right:calc(18px + env(safe-area-inset-right));bottom:calc(98px + env(safe-area-inset-bottom));background:var(--glass-strong);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);cursor:default}
.sheet{width:320px;max-height:min(72vh,660px);overflow-y:auto;padding:2px 18px 12px;scrollbar-width:thin}
.sheet section{padding:16px 0}
.sheet section+section,.sheet details{border-top:1px solid var(--line)}
.sheet h3,.sheet h4{font:400 10px/1 'Jost',sans-serif;letter-spacing:.24em;text-transform:uppercase;color:var(--mute);margin:0 0 12px}
.sheet h4{margin:18px 0 10px}
.sheet label{display:grid;grid-template-columns:1fr 1.5fr;align-items:center;gap:12px;font-size:13px;color:var(--mute);margin:8px 0}
.sheet select{font:300 13px/1.3 'Jost',sans-serif;color:var(--ink);background:var(--faint);border:1px solid var(--line);border-radius:8px;padding:6px 8px;outline:none;width:100%}
.sheet select:focus-visible{border-color:var(--accent)}
.sheet select option{color:#111;background:#fff}
.sheet p{margin:10px 0 0;font-size:12px;line-height:1.45;color:var(--mute)}
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.chips button{height:34px;padding:0;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:10px;font-size:13px;cursor:pointer;
 display:grid;place-items:center;transition:background .2s,border-color .2s,color .2s}
.chips button:hover,.chips button:focus-visible{border-color:var(--ink);outline:none}
.chips button.cur{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.sheet .desc{font-size:12.5px;color:var(--ink);opacity:.8;min-height:2.9em}
.swatches{display:grid;grid-template-columns:repeat(8,28px);justify-content:space-between;align-items:center}
.sw{width:28px;height:28px;border-radius:50%;border:0;padding:0;margin:0;cursor:pointer;background:var(--c);position:relative;
 display:grid;place-items:center;box-shadow:inset 0 0 0 1px rgba(0,0,0,.14);transition:transform .15s}
.sw:hover,.sw:focus-visible{transform:scale(1.12);outline:none}
.sw.cur{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--ink)}
.sw svg{width:14px;height:14px;fill:none;stroke:#fff;stroke-width:2.4;stroke-linecap:round;filter:drop-shadow(0 0 1.5px rgba(0,0,0,.6));pointer-events:none}
.sw input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;border:0;padding:0}
.sw.auto{background:conic-gradient(from 200deg,#f2b95a,#ff6b40,#ff5290,#9a4de6,#33d6cc,#f2b95a)}
.sl+.sl{margin-top:16px}
.slh{font-size:13px;color:var(--ink);margin-bottom:9px}
.ends{display:flex;justify-content:space-between;font-size:11px;color:var(--mute);margin-top:7px}
input[type=range]{-webkit-appearance:none;appearance:none;display:block;width:100%;height:3px;margin:0;background:var(--line);outline:none;border-radius:3px;cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--ink);border:0}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--ink);border:0}
input[type=range]:focus-visible::-webkit-slider-thumb{box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 40%,transparent)}
details.more summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;padding:16px 0 4px;
 font:400 10px/1 'Jost',sans-serif;letter-spacing:.24em;text-transform:uppercase;color:var(--mute)}
details.more summary svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s}
details.more[open] summary svg{transform:rotate(180deg)}
details.more summary::-webkit-details-marker{display:none}
.btns{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.btns button{font-size:12px;color:var(--mute);background:transparent;border:1px solid var(--line);border-radius:999px;padding:7px 12px;cursor:pointer;transition:color .2s,border-color .2s}
.btns button:hover,.btns button:focus-visible{color:var(--ink);border-color:var(--ink);outline:none}
.btns button.on{color:var(--accent);border-color:var(--accent)}
.mobile-only{display:none}
.quick{margin:14px 0 2px}
.quick button{flex:1}

/* съёмка */
.pop{width:268px;padding:14px}
.big{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.big button{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 8px;border-radius:12px;border:1px solid var(--line);
 background:var(--faint);cursor:pointer;font-size:13px;color:var(--ink);transition:border-color .2s,background .2s}
.big button:hover,.big button:focus-visible{border-color:var(--ink);outline:none}
.big svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.big #pGo svg circle{fill:var(--rec);stroke:none}
.big button[disabled]{opacity:.45;cursor:default}
.pop label{display:grid;grid-template-columns:1fr 1.6fr;align-items:center;gap:10px;font-size:13px;color:var(--mute)}
.pop select{font:300 13px/1.3 'Jost',sans-serif;color:var(--ink);background:var(--faint);border:1px solid var(--line);border-radius:8px;padding:6px 8px;outline:none;width:100%}
.pop select option{color:#111;background:#fff}
.pop p{margin:10px 0 0;font-size:12px;line-height:1.4;color:var(--mute)}

/* плашка записи: не гаснет и в видео не попадает — пишется только холст */
.recpill{position:fixed;z-index:4;top:calc(18px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:10px;
 padding:6px 6px 6px 16px;border-radius:999px;background:var(--glass-strong);border:1px solid var(--line);box-shadow:var(--shadow);user-select:none}
.recdot{width:10px;height:10px;border-radius:50%;background:var(--rec);animation:pulse 1.2s ease-in-out infinite}
.recpill.paused .recdot{animation:none;opacity:.45}
.reclabel{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--mute)}
.rectime{font:400 15px/1 'Jost',sans-serif;font-variant-numeric:tabular-nums;min-width:4.6ch}
.recpill button{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer;display:grid;place-items:center;padding:0}
.recpill button:hover,.recpill button:focus-visible{border-color:var(--ink);outline:none}
.recpill #recStop{background:var(--rec);border-color:var(--rec);color:#fff}
.recpill svg{width:15px;height:15px;fill:currentColor}
.recpill .i-play{display:none}
.recpill.paused .i-pause{display:none}
.recpill.paused .i-play{display:block}
@keyframes pulse{50%{opacity:.35}}

/* руки */
.cam{position:fixed;z-index:3;left:calc(18px + env(safe-area-inset-left));bottom:calc(18px + env(safe-area-inset-bottom));width:228px;border-radius:16px;overflow:hidden;background:var(--glass-strong);
 border:1px solid var(--line);box-shadow:var(--shadow);user-select:none;cursor:default}
.camhead{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 8px 8px 12px;font-size:12px;color:var(--mute)}
.camhead b{font-weight:400;color:var(--ink)}
.camhead button{width:26px;height:26px;border-radius:50%;border:0;background:transparent;color:var(--mute);cursor:pointer;font-size:16px;line-height:1}
.camhead button:hover{color:var(--ink);background:var(--faint)}
.vwrap{position:relative;aspect-ratio:4/3;background:#000}
.vwrap video,.vwrap canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.vwrap video{opacity:.8}
.legend{list-style:none;margin:0;padding:10px 12px 4px;display:grid;gap:3px;font-size:12px;color:var(--ink)}
.legend li span{color:var(--mute)}
.private{margin:0;padding:2px 12px 10px;font-size:11px;color:var(--mute)}
.tip{position:fixed;z-index:3;left:0;top:0;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;
 border:2px solid var(--accent);pointer-events:none;transition:transform .05s linear,width .15s,height .15s,margin .15s,background .15s;
 box-shadow:0 0 18px color-mix(in srgb,var(--accent) 40%,transparent)}
.tip.paint{width:20px;height:20px;margin:-10px 0 0 -10px;background:var(--accent)}
.tip.stir{border-style:dashed;width:64px;height:64px;margin:-32px 0 0 -32px}
.tip.peace{opacity:.5}
.tip.fist{border:0;width:40px;height:40px;margin:-20px 0 0 -20px;
 background:conic-gradient(var(--accent) calc(var(--p,0)*360deg),color-mix(in srgb,var(--accent) 22%,transparent) 0);
 -webkit-mask:radial-gradient(circle,transparent 13px,#000 14px);mask:radial-gradient(circle,transparent 13px,#000 14px)}

.bare .ui,.bare .welcome,.bare .tip,.bare .cam,.bare .recpill{display:none!important}
.welcome{position:fixed;inset:0;z-index:5;display:grid;place-items:start center;padding:max(20px,min(9vh,84px)) 20px 20px;cursor:default;
 background:color-mix(in srgb,var(--bg) 45%,transparent);opacity:0;transition:opacity .45s ease}
.welcome.on{opacity:1}
.wcard{width:min(520px,100%);max-height:calc(100dvh - max(40px,min(9vh,84px)) - 20px);overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--line) transparent;background:var(--card);border:1px solid var(--line);
 border-radius:22px;box-shadow:var(--shadow);padding:22px 22px 18px;transform:translateY(12px);transition:transform .45s ease}
.welcome.on .wcard{transform:none}
.whead{display:grid;grid-template-columns:1fr auto;align-items:center;column-gap:12px}
.whead .wname{grid-area:1/1}
.wctl{grid-area:1/2;display:flex;gap:8px}
.whead .wtag{grid-area:2/1/3/3}
.wname{font:600 30px/1 'Fraunces',Georgia,serif;color:var(--ink)}
.wtag{margin-top:9px;font-size:13px;line-height:1.45;color:var(--mute)}
.seg{display:inline-flex;flex:none;border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;color:var(--mute);font-size:12px;letter-spacing:.08em;padding:6px 12px;border-radius:999px;cursor:pointer}
.seg button:hover{color:var(--ink)}
.seg button.cur{background:var(--ink);color:var(--bg)}
.seg.icon button{padding:5px 9px;display:grid;place-items:center}
.seg svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.wlist{list-style:none;margin:14px 0 0;padding:0}
.wlist li{display:grid;grid-template-columns:40px 1fr auto;align-items:center;gap:14px;padding:9px 0;border-top:1px solid var(--line)}
.wlist li:first-child{border-top:0}
.wi{width:40px;height:40px;border-radius:12px;background:var(--faint);display:grid;place-items:center;color:var(--ink)}
.wi svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.wlist b{display:block;font-weight:400;font-size:14.5px;color:var(--ink)}
.wlist p{margin:3px 0 0;font-size:12.5px;line-height:1.4;color:var(--mute)}
.wact{min-width:128px;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:8px 14px;font-size:12.5px;cursor:pointer;white-space:nowrap;text-align:center}
.wact:hover,.wact:focus-visible{border-color:var(--ink);outline:none}
.wact.on{border-color:var(--accent);color:var(--accent)}
.wact.try:not(.on){background:var(--ink);border-color:var(--ink);color:var(--bg)}

<script>
const $=id=>document.getElementById(id);
const QP=new URLSearchParams(location.search);
// ?seed=N делает случайность воспроизводимой: нужно для сравнения рендеров
if(QP.has('seed')){let a=(+QP.get('seed')||1)>>>0;Math.random=function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const canvas=$('c');
const gl=canvas.getContext('webgl2',{alpha:false,depth:false,stencil:false,antialias:false});
if(!gl||!gl.getExtension('EXT_color_buffer_float')){$('err').style.display='grid';throw new Error('no webgl2 float');}
gl.getExtension('OES_texture_float_linear');
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
const bare=/[?&]bare\b/.test(location.search);
if(bare)document.documentElement.classList.add('bare');
const clamp01=v=>v<0?0:v>1?1:v;

// ---------- settings ----------
const PRESETS={
 tush:{speed:.65,amount:1,curl:28,grav:14,diff:.3,rad:1,fiber:.3,sharp:1},
 silk:{speed:.55,amount:.8,curl:62,grav:3,diff:.04,rad:.35,fiber:1.1,sharp:1.5},
 smoke:{speed:.8,amount:.55,curl:18,grav:-18,diff:.9,rad:2.2,fiber:.5,sharp:.6},
 oil:{speed:.4,amount:1.9,curl:4,grav:56,diff:0,rad:2.2,fiber:0,sharp:1.85},
 water:{speed:.55,amount:.6,curl:5,grav:2,diff:1,rad:2.8,fiber:.15,sharp:.5},
 dust:{speed:.8,amount:.45,curl:78,grav:8,diff:0,rad:.25,fiber:1.2,sharp:1.9}};
const S={preset:'tush',speed:.65,amount:1,curl:30,grav:14,diff:.35,rad:1,fiber:.35,sharp:1,detail:'auto',auto:'idle',drops:'on',vol:.8,sens:1,ink:-1,recLen:0,recSize:'1920x1080',custom:null};
let saved=null;try{saved=JSON.parse(localStorage.getItem('inkfall2')||'null')}catch(e){}
const coarse=matchMedia('(pointer:coarse)').matches;
const weak=coarse||(navigator.hardwareConcurrency||8)<=4;
if(weak)S.speed=.6;
if(saved)Object.assign(S,saved);
S.detail='auto';
// каждый заход — новый характер, чтобы сразу знакомиться с разными стилями
let startLook=null;
if(!QP.has('look')&&!QP.has('seed')){const ks=Object.keys(PRESETS).filter(k=>k!==S.preset);startLook=ks[Math.floor(Math.random()*ks.length)];Object.assign(S,PRESETS[startLook]);S.preset=startLook}
// ссылка может задать вид сцены: ?look=silk&flow=1.2&brush=2&swirl=60&weight=0&ink=3
if(PRESETS[QP.get('look')]){Object.assign(S,PRESETS[QP.get('look')]);S.preset=QP.get('look')}
[['flow','speed',.15,1.8],['brush','rad',.25,3],['swirl','curl',0,80],['weight','grav',-30,60]].forEach(([q,k,a,b])=>{
 const v=parseFloat(QP.get(q));if(isFinite(v)){S[k]=Math.min(b,Math.max(a,v));S.preset='custom'}});
if(QP.has('ink')){const i=parseInt(QP.get('ink'));if(i>=-1&&i<=5)S.ink=i}
let booted=false;
function save(){if(!booted)return;try{localStorage.setItem('inkfall2',JSON.stringify(S))}catch(e){}}
let THEME=document.documentElement.dataset.theme==='light'?'light':'dark';

// ---------- shaders ----------
const VS=`#version 300 es
precision highp float;in vec2 a;out vec2 vUv,vL,vR,vT,vB;uniform vec2 texelSize;
void main(){vUv=a*.5+.5;vL=vUv-vec2(texelSize.x,0.);vR=vUv+vec2(texelSize.x,0.);vT=vUv+vec2(0.,texelSize.y);vB=vUv-vec2(0.,texelSize.y);gl_Position=vec4(a,0.,1.);}`;
const H=`#version 300 es
precision highp float;precision highp sampler2D;in vec2 vUv,vL,vR,vT,vB;out vec4 o;`;
const F={
splat:H+`uniform sampler2D uTarget;uniform float aspect,radius;uniform vec3 color;uniform vec2 point;
void main(){vec2 p=vUv-point;p.x*=aspect;o=vec4(texture(uTarget,vUv).xyz+exp(-dot(p,p)/radius)*color,1.);}`,
advect:H+`uniform sampler2D uVelocity,uSource;uniform vec2 texelSize,srcTexel;uniform float dt,dissipation,diffuse,fiber,ntime;
float h21(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}
float vn(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);
 return mix(mix(h21(i),h21(i+vec2(1,0)),f.x),mix(h21(i+vec2(0,1)),h21(i+vec2(1,1)),f.x),f.y);}
vec2 curlN(vec2 p){float e=.09;
 float a=vn(p+vec2(0,e)),b=vn(p-vec2(0,e)),c1=vn(p+vec2(e,0)),d1=vn(p-vec2(e,0));
 return vec2(a-b,d1-c1)/(2.*e);}
void main(){vec2 c=vUv-dt*texture(uVelocity,vUv).xy*texelSize;
 if(fiber>0.){vec2 f1=curlN(vUv*10.+vec2(ntime*.028,-ntime*.019));
  vec2 f2=curlN(vUv*26.+vec2(-ntime*.047,ntime*.036));
  c+=(f1*.62+f2*.38)*fiber*srcTexel*3.2;}
 vec4 v=texture(uSource,c);
 if(diffuse>0.){vec4 nb=(texture(uSource,c+vec2(srcTexel.x,0.))+texture(uSource,c-vec2(srcTexel.x,0.))+texture(uSource,c+vec2(0.,srcTexel.y))+texture(uSource,c-vec2(0.,srcTexel.y)))*.25;
  v=mix(v,nb,diffuse);}
 o=dissipation*v;o.a=1.;}`,
div:H+`uniform sampler2D uVelocity;
void main(){float L=texture(uVelocity,vL).x,R=texture(uVelocity,vR).x,T=texture(uVelocity,vT).y,B=texture(uVelocity,vB).y;vec2 C=texture(uVelocity,vUv).xy;
 if(vL.x<0.)L=-C.x;if(vR.x>1.)R=-C.x;if(vT.y>1.)T=-C.y;if(vB.y<0.)B=-C.y;o=vec4(.5*(R-L+T-B),0.,0.,1.);}`,
curl:H+`uniform sampler2D uVelocity;
void main(){float L=texture(uVelocity,vL).y,R=texture(uVelocity,vR).y,T=texture(uVelocity,vT).x,B=texture(uVelocity,vB).x;o=vec4(.5*(R-L-T+B),0.,0.,1.);}`,
vort:H+`uniform sampler2D uVelocity,uCurl,uDye;uniform float curl,dt,grav;
void main(){float L=texture(uCurl,vL).x,R=texture(uCurl,vR).x,T=texture(uCurl,vT).x,B=texture(uCurl,vB).x,C=texture(uCurl,vUv).x;
 vec2 f=.5*vec2(abs(T)-abs(B),abs(R)-abs(L));f/=length(f)+1e-4;f*=curl*C;f.y*=-1.;vec2 v=texture(uVelocity,vUv).xy+f*dt;
 float d=length(texture(uDye,vUv).rgb);
 v.y-=grav*d*dt;
 v*=1.-min(.5,dt*d*.35);
 o=vec4(clamp(v,-1000.,1000.),0.,1.);}`,
press:H+`uniform sampler2D uPressure,uDivergence;
void main(){float L=texture(uPressure,vL).x,R=texture(uPressure,vR).x,T=texture(uPressure,vT).x,B=texture(uPressure,vB).x;o=vec4((L+R+B+T-texture(uDivergence,vUv).x)*.25,0.,0.,1.);}`,
grad:H+`uniform sampler2D uPressure,uVelocity;
void main(){float L=texture(uPressure,vL).x,R=texture(uPressure,vR).x,T=texture(uPressure,vT).x,B=texture(uPressure,vB).x;vec2 v=texture(uVelocity,vUv).xy-vec2(R-L,T-B);o=vec4(v,0.,1.);}`,
clear:H+`uniform sampler2D uTexture;uniform float value;void main(){o=value*texture(uTexture,vUv);}`,
show:H+`uniform sampler2D uTexture;uniform vec2 texelSize;uniform float time,sharp,light;uniform vec3 paper;
float hash(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}
void main(){
 vec3 c=texture(uTexture,vUv).rgb;
 float raw=length(c);
 vec3 tint=c/max(raw,1e-4);
 float d=pow(raw,sharp);
 float l=length(texture(uTexture,vL).rgb),r=length(texture(uTexture,vR).rgb),
       tt=length(texture(uTexture,vT).rgb),b=length(texture(uTexture,vB).rgb);
 vec3 n=normalize(vec3(r-l,tt-b,length(texelSize)*2.4));
 float lam=clamp(dot(n,normalize(vec3(-.28,.6,.75))),0.,1.);
 vec2 q=vUv-.5;
 if(light>.5){
  // фарфоровая чаша: пигмент не светится, а поглощает свет по пути к белому дну и обратно
  vec3 absorb=(1.-tint)*2.3+.3;
  vec3 Tl=exp(-d*2.*absorb);
  // край потёка темнее середины, как у настоящей туши на мокром
  float edge=clamp(length(vec2(r-l,tt-b))*9.,0.,1.);
  Tl*=1.-edge*.3*smoothstep(.02,.25,d);
  vec3 base=paper*(1.+(hash(floor(gl_FragCoord.xy))-.5)*.018);
  vec3 col=base*Tl;
  col+=vec3(1.)*pow(lam,34.)*smoothstep(.25,.8,d)*.07;
  col*=1.-.32*dot(q,q);
  o=vec4(clamp(col,0.,1.),1.);
  return;
 }
 // свет проходит сквозь слой пигмента и возвращается: то, что не поглощено
 vec3 absorb=(1.-tint)*2.0+.14;
 vec3 T=exp(-d*2.4*absorb);
 float S=1.-exp(-d*2.6);
 vec3 water=vec3(.05,.043,.058),lamp=vec3(1.,.955,.885);
 vec3 col=water*(1.-S)+lamp*T*S*2.35*(.72+.5*lam);
 col+=lamp*tint*smoothstep(.55,.02,d)*d*1.1;
 col+=lamp*pow(lam,26.)*smoothstep(.2,.7,d)*.14;
 col+=(hash(gl_FragCoord.xy+fract(time*7.))-.5)*.022;
 col*=1.-.5*dot(q,q);
 col=col/(1.+col*.16);
 o=vec4(pow(max(col,0.),vec3(.95)),1.);}`};

function compile(t,s){const o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);if(!gl.getShaderParameter(o,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(o));return o}
const vs=compile(gl.VERTEX_SHADER,VS);
const P={};for(const k in F){const p=gl.createProgram();gl.attachShader(p,vs);gl.attachShader(p,compile(gl.FRAGMENT_SHADER,F[k]));gl.linkProgram(p);
 if(!gl.getProgramParameter(p,gl.LINK_STATUS))throw new Error(gl.getProgramInfoLog(p));P[k]={p,u:{}};
 const n=gl.getProgramParameter(p,gl.ACTIVE_UNIFORMS);for(let i=0;i<n;i++){const nm=gl.getActiveUniform(p,i).name;P[k].u[nm]=gl.getUniformLocation(p,nm)}}
gl.bindBuffer(gl.ARRAY_BUFFER,gl.createBuffer());gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
gl.enableVertexAttribArray(0);gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);

// ---------- framebuffers ----------
function fbo(w,h){const tex=gl.createTexture();gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,tex);
 gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
 gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
 gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA16F,w,h,0,gl.RGBA,gl.HALF_FLOAT,null);
 const fb=gl.createFramebuffer();gl.bindFramebuffer(gl.FRAMEBUFFER,fb);gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,tex,0);
 gl.viewport(0,0,w,h);gl.clear(gl.COLOR_BUFFER_BIT);
 return{tex,fb,w,h,tx:1/w,ty:1/h,bind(u){gl.activeTexture(gl.TEXTURE0+u);gl.bindTexture(gl.TEXTURE_2D,tex);return u}}}
function dfbo(w,h){let a=fbo(w,h),b=fbo(w,h);return{w,h,tx:1/w,ty:1/h,get read(){return a},get write(){return b},swap(){[a,b]=[b,a]}}}
function res(r){const asp=canvas.width/canvas.height,mn=Math.round(r),mx=Math.round(r*Math.max(asp,1/asp));return asp>1?{w:mx,h:mn}:{w:mn,h:mx}}
function blit(t){if(t){gl.bindFramebuffer(gl.FRAMEBUFFER,t.fb);gl.viewport(0,0,t.w,t.h)}else{gl.bindFramebuffer(gl.FRAMEBUFFER,null);gl.viewport(0,0,canvas.width,canvas.height)}gl.drawArrays(gl.TRIANGLE_STRIP,0,4)}
function use(k,tx,ty){gl.useProgram(P[k].p);gl.uniform2f(P[k].u.texelSize,tx,ty);return P[k].u}
let vel,dye,div,curl,pres,dyeCap=weak?1024:1536,capturing=false;
const STEPS=[768,1024,1536,2048,3072];
let liveDetail=weak?1024:1536;
function targetDetail(){return S.detail==='auto'?liveDetail:+S.detail}
// мерим время кадра и сами двигаем сетку, пока выбрано «авто»
let ftAcc=0,ftN=0,lastTune=0;
let tuneLock=false;
function tune(now,real){
 if(S.detail!=='auto'||capturing||document.hidden){ftAcc=0;ftN=0;lastTune=now;return}
 ftAcc+=real;ftN++;
 if(now-lastTune<3000||ftN<60)return;
 const avg=ftAcc/ftN;ftAcc=0;ftN=0;lastTune=now;
 const i=STEPS.indexOf(liveDetail);if(i<0)return;
 // один раз опустились — больше не поднимаемся, иначе сетка скачет туда-обратно и дёргает кадр
 if(avg>1/45&&i>0){liveDetail=STEPS[i-1];tuneLock=true;dyeCap=liveDetail;init()}

 let drawing=false;for(const q of ptrs.values())if(q.down){drawing=true;break}
 if(drawing)lastActive=now;

 document.body.classList.toggle('awake',!!openWhich||(awake&&!drawing&&now>quietUntil));
 // пока слушает микрофон, кисть ведёт звук: в тишине стоит, громче — быстрее и гуще

 const u=use('show',dye.tx,dye.ty);gl.uniform1i(u.uTexture,dye.read.bind(0));gl.uniform1f(u.time,tsec);gl.uniform1f(u.sharp,S.sharp);

 requestAnimationFrame(frame)}
