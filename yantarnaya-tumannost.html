<style>
:root{--bg:#07040c;--ink:#f3e6d3;--mute:rgba(243,230,211,.55);--amber:#ffb35c}
html,body{height:100%;margin:0;background:var(--bg);overflow:hidden}
body{color:var(--ink);font:300 14px/1.5 'Jost',system-ui,sans-serif}
canvas{position:fixed;inset:0;width:100%;height:100%}
#gl{z-index:0}#dust{z-index:1;pointer-events:none}
.ui{position:fixed;z-index:2;user-select:none}
.name{left:28px;top:22px;font:italic 300 30px/1 'Cormorant Garamond',Georgia,serif;letter-spacing:.02em;text-shadow:0 0 24px rgba(255,179,92,.35)}
.name span{display:block;font:300 11px/1.6 'Jost',sans-serif;letter-spacing:.24em;text-transform:uppercase;color:var(--mute);margin-top:6px}
.hint{left:28px;right:28px;bottom:22px;max-width:46ch;color:var(--mute);letter-spacing:.06em;transition:opacity 2s}
.hint.gone{opacity:0}
#snd{right:28px;bottom:20px;font:300 12px/1 'Jost',sans-serif;letter-spacing:.2em;text-transform:uppercase;color:var(--ink);background:rgba(7,4,12,.35);border:1px solid rgba(243,230,211,.35);border-radius:999px;padding:10px 16px;cursor:pointer;backdrop-filter:blur(6px);transition:border-color .3s,color .3s}
#snd:hover,#snd:focus-visible{border-color:var(--amber);color:var(--amber);outline:none}
#snd.on{border-color:var(--amber);color:var(--amber);box-shadow:0 0 18px rgba(255,179,92,.25)}
@media (max-width:600px){.name{font-size:24px}.hint{font-size:13px;bottom:18px}.backlink{bottom:64px}}
</style>
<style>.backlink{position:fixed;left:28px;bottom:52px;z-index:3;font:300 11px/1 'Jost',system-ui,sans-serif;letter-spacing:.18em;text-transform:uppercase;color:rgba(243,230,211,.45);text-decoration:none;transition:color .3s}
.backlink:hover,.backlink:focus-visible{color:rgba(243,230,211,.95);outline:none}</style>
<script>
// Аналитика Vercel: только просмотры страниц, без куки и личных данных.
// На localhost и при открытии файла с диска не грузится.
if(location.protocol.startsWith('http')&&!/^(localhost|127\.|\[::1\])/.test(location.hostname)){
  var a=document.createElement('script');a.defer=true;a.src='/_vercel/insights/script.js';document.head.appendChild(a);
}

<body>
<canvas id="gl"></canvas>
<canvas id="dust"></canvas>
<div class="ui name">Янтарная туманность<span>медленно · тепло · тихо</span></div>
<a class="backlink ui" id="back" href="./">← все сцены</a>
<div class="ui hint" id="hint">Веди мышью, чтобы закрутить газ. Нажми, чтобы зажечь звезду.</div>
<button class="ui" id="snd">звук выкл</button>

<script>
// ---------- nebula (WebGL) ----------
const gl=document.getElementById('gl').getContext('webgl',{antialias:false});
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
const VS='attribute vec2 a;void main(){gl_Position=vec4(a,0.,1.);}';
const FS=`precision highp float;uniform vec2 R;uniform float T;uniform vec2 M;uniform float S;uniform float F;uniform vec2 FP;
float hash(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}
float noise(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);
 return mix(mix(hash(i),hash(i+vec2(1,0)),f.x),mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x),f.y);}
float fbm(vec2 p){float v=0.,a=.5;mat2 m=mat2(.8,.6,-.6,.8);for(int i=0;i<6;i++){v+=a*noise(p);p=m*p*2.03;a*=.5;}return v;}
float stars(vec2 p,float t,float th){vec2 i=floor(p),f=fract(p);float h=hash(i);if(h<th)return 0.;
 vec2 o=vec2(.2+.6*hash(i+1.7),.2+.6*hash(i+3.1));float d=length(f-o);float tw=.55+.45*sin(t*(.6+h*2.5)+h*40.);
 return tw*smoothstep(.09,.0,d)*(h-th)/(1.-th);}
void main(){
 vec2 uv=(gl_FragCoord.xy-.5*R)/R.y;vec2 mu=(M-.5*R)/R.y;
 vec2 d=uv-mu;float r=length(d);float ang=S*exp(-r*r*7.);
 float c=cos(ang),s=sin(ang);vec2 p=mu+mat2(c,-s,s,c)*d;p-=d*.12*exp(-r*r*5.);
 float t=T*.045;
 vec2 q=vec2(fbm(p*1.5+t),fbm(p*1.5+vec2(5.2,1.3)-t*.8));
 vec2 w=vec2(fbm(p*1.5+2.*q+vec2(1.7,9.2)+.2*t),fbm(p*1.5+2.*q+vec2(8.3,2.8)-.15*t));
 float f=fbm(p*1.5+2.2*w);
 vec3 deep=vec3(.06,.02,.07),violet=vec3(.42,.16,.42),rose=vec3(1.,.4,.5),amber=vec3(1.,.68,.32),gold=vec3(1.,.92,.74);
 vec3 col=mix(deep,violet,smoothstep(.2,.42,f));
 col=mix(col,rose,smoothstep(.34,.58,f)*clamp(length(q)*1.5,0.,1.));
 col=mix(col,amber,smoothstep(.42,.68,f)*clamp(w.x*1.6,0.,1.));
 col=mix(col,gold,smoothstep(.6,.86,f));
 col*=.85+.8*f;
 // slow warm breathing
 col*=.92+.08*sin(T*.35);
 // touch glow
 col+=amber*.22*exp(-r*r*12.)*(.7+.3*sin(T*1.6));
 // star flash
 vec2 fd=uv-(FP-.5*R)/R.y;float fr=length(fd);
 col+=gold*F*(exp(-fr*fr*40.)*2.+exp(-fr*14.)*.6);
 col+=gold*F*F*smoothstep(.01,.0,abs(fd.x)*(1.-F*.5))*exp(-fr*6.)*.8;
 col+=gold*F*F*smoothstep(.01,.0,abs(fd.y)*(1.-F*.5))*exp(-fr*6.)*.8;
 // stars, dimmed behind bright gas, slight parallax
 float dim=1.-smoothstep(.45,.8,f);
 col+=vec3(1.,.95,.88)*stars(uv*R.y/28.+mu*3.,T,.93)*dim*.9;
 col+=vec3(1.,.85,.7)*stars(uv*R.y/14.+mu*1.5+7.,T*.7,.965)*dim*.5;
 col*=1.-.45*dot(uv,uv);
 col=pow(col,vec3(.92));
 gl_FragColor=vec4(col,1.);}`;
function sh(t,s){const o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);if(!gl.getShaderParameter(o,gl.COMPILE_STATUS))console.error(gl.getShaderInfoLog(o));return o}
const prog=gl.createProgram();gl.attachShader(prog,sh(gl.VERTEX_SHADER,VS));gl.attachShader(prog,sh(gl.FRAGMENT_SHADER,FS));gl.linkProgram(prog);gl.useProgram(prog);
gl.bindBuffer(gl.ARRAY_BUFFER,gl.createBuffer());gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
const a=gl.getAttribLocation(prog,'a');gl.enableVertexAttribArray(a);gl.vertexAttribPointer(a,2,gl.FLOAT,false,0,0);
const U=n=>gl.getUniformLocation(prog,n),uR=U('R'),uT=U('T'),uM=U('M'),uS=U('S'),uF=U('F'),uFP=U('FP');

// ---------- dust (2D) ----------
const dc=document.getElementById('dust'),dx=dc.getContext('2d');
let W=0,H=0,scale=1;const motes=[];
function resize(){W=innerWidth;H=innerHeight;scale=Math.min(1.25,devicePixelRatio||1)*(W>1400?.6:.75);
 gl.canvas.width=W*scale;gl.canvas.height=H*scale;gl.viewport(0,0,gl.canvas.width,gl.canvas.height);
 dc.width=W;dc.height=H;
 const n=Math.round(W*H/9000);while(motes.length<n)motes.push({x:Math.random()*W,y:Math.random()*H,vx:0,vy:0,r:.6+Math.random()*1.8,ph:Math.random()*7,sp:.4+Math.random()});motes.length=n;}
addEventListener('resize',resize);resize();

// ---------- pointer ----------
let tx=W/2,ty=H/2,mx=tx,my=ty,swirl=0,lastMove=-1e9,flash=0,fpx=0,fpy=0,dist=0,lx=0,ly=0;
function move(x,y){const now=performance.now();if(lastMove>0){const dx_=x-lx,dy_=y-ly;swirl+=(dx_-dy_)*.0035;swirl=Math.max(-2.4,Math.min(2.4,swirl));dist+=Math.hypot(dx_,dy_);}
 tx=x;ty=y;lx=x;ly=y;lastMove=now;hint.classList.add('gone');
 if(dist>110){dist=0;chime(1-y/H);}}
addEventListener('pointermove',e=>move(e.clientX,e.clientY));
addEventListener('pointerdown',e=>{move(e.clientX,e.clientY);flash=1;fpx=e.clientX;fpy=e.clientY;swirl+=(Math.random()<.5?-1:1)*.9;chord();});

// ---------- sound ----------
let ac=null,master,delay,on=false,lastChime=0;
const PENTA=[0,2,4,7,9,12,14,16,19,21];const base=220;
function initAudio(){ac=new (window.AudioContext||window.webkitAudioContext)();master=ac.createGain();master.gain.value=0;
 const lp=ac.createBiquadFilter();lp.type='lowpass';lp.frequency.value=3200;
 delay=ac.createDelay(2);delay.delayTime.value=.42;const fb=ac.createGain();fb.gain.value=.45;const wet=ac.createGain();wet.gain.value=.5;
 master.connect(lp);lp.connect(ac.destination);master.connect(delay);delay.connect(fb);fb.connect(delay);delay.connect(wet);wet.connect(lp);
 // drone: two detuned sines an octave apart + slow LFO
 [[55,.09],[110,.05],[164.8,.02]].forEach(([f,g])=>{const o=ac.createOscillator();o.type='sine';o.frequency.value=f;const o2=ac.createOscillator();o2.type='sine';o2.frequency.value=f*1.004;
  const gn=ac.createGain();gn.gain.value=g;const lfo=ac.createOscillator();lfo.frequency.value=.07+Math.random()*.05;const lg=ac.createGain();lg.gain.value=g*.5;lfo.connect(lg);lg.connect(gn.gain);
  o.connect(gn);o2.connect(gn);gn.connect(master);o.start();o2.start();lfo.start();});}
function note(freq,vol,dur){if(!on)return;const t=ac.currentTime;const o=ac.createOscillator();o.type='triangle';o.frequency.value=freq;
 const o2=ac.createOscillator();o2.type='sine';o2.frequency.value=freq*2;const g=ac.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
 const g2=ac.createGain();g2.gain.value=.25;o.connect(g);o2.connect(g2);g2.connect(g);g.connect(master);o.start(t);o2.start(t);o.stop(t+dur);o2.stop(t+dur);}
function chime(h){const now=performance.now();if(!on||now-lastChime<170)return;lastChime=now;const i=Math.min(PENTA.length-1,Math.floor(h*PENTA.length));note(base*Math.pow(2,PENTA[i]/12),.08,2.8);}
function chord(){if(!on)return;const r=Math.floor(Math.random()*4);[0,2,4].forEach((k,j)=>setTimeout(()=>note(base/2*Math.pow(2,PENTA[r+k]/12),.1,4.5),j*90));}
snd.onclick=()=>{if(!ac)initAudio();if(ac.state==='suspended')ac.resume();on=!on;master.gain.setTargetAtTime(on?1:0,ac.currentTime,.4);snd.textContent=on?'звук вкл':'звук выкл';snd.classList.toggle('on',on);};

// ---------- loop ----------
const t0=performance.now();
function frame(now){const t=(now-t0)/1000*(reduced?.35:1);
 // idle drift when the pointer rests
 if(now-lastMove>4000){tx=W/2+Math.sin(t*.13)*W*.28;ty=H/2+Math.cos(t*.09)*H*.22;}
 mx+=(tx-mx)*.045;my+=(ty-my)*.045;swirl*=.975;flash*=.94;
 gl.uniform2f(uR,gl.canvas.width,gl.canvas.height);gl.uniform1f(uT,t);gl.uniform2f(uM,mx*scale,(H-my)*scale);gl.uniform1f(uS,swirl);gl.uniform1f(uF,flash);gl.uniform2f(uFP,fpx*scale,(H-fpy)*scale);
 gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
 // dust
 dx.clearRect(0,0,W,H);dx.globalCompositeOperation='lighter';
 for(const m of motes){const ddx=mx-m.x,ddy=my-m.y,d2=ddx*ddx+ddy*ddy+4000,pull=Math.min(.06,9000/d2);
  // gentle curl field + pull toward the pointer + swirl
  m.vx+=Math.sin(m.y*.004+t*.3)*.012*m.sp+ddx/Math.sqrt(d2)*pull-ddy/Math.sqrt(d2)*swirl*.05;
  m.vy+=Math.cos(m.x*.004-t*.25)*.012*m.sp+ddy/Math.sqrt(d2)*pull+ddx/Math.sqrt(d2)*swirl*.05-.004;
  m.vx*=.985;m.vy*=.985;m.x+=m.vx;m.y+=m.vy;
  if(m.x<-10)m.x=W+10;if(m.x>W+10)m.x=-10;if(m.y<-10)m.y=H+10;if(m.y>H+10)m.y=-10;
  const tw=.35+.65*(.5+.5*Math.sin(t*m.sp*2+m.ph)),r=m.r*(1+tw),near=Math.min(1,20000/d2);
  const g=dx.createRadialGradient(m.x,m.y,0,m.x,m.y,r*4);g.addColorStop(0,`rgba(255,235,200,${.55*tw+.3*near})`);g.addColorStop(.35,`rgba(255,180,100,${.25*tw})`);g.addColorStop(1,'rgba(255,150,80,0)');
  dx.fillStyle=g;dx.fillRect(m.x-r*4,m.y-r*4,r*8,r*8);}
 requestAnimationFrame(frame);}
requestAnimationFrame(frame);
</script>
</body>
